apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-assistant
  namespace: {{ .Release.Namespace }}
---
# Только чтение и только namespace с приложениями. Секреты недоступны, изменять ассистент ничего не может
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llm-assistant
  namespace: {{ .Values.targetNamespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llm-assistant
  namespace: {{ .Values.targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: llm-assistant
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: llm-assistant
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-assistant
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  openai-api-key: {{ .Values.openai.apiKey | quote }}
  anthropic-api-key: {{ .Values.anthropic.apiKey | quote }}
  diagnose-token: {{ .Values.token | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-assistant
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm-assistant
    app.kubernetes.io/part-of: sre-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-assistant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-assistant
      annotations:
        checksum/config: {{ printf "%s%s%s%s%s%s%s" .Values.provider .Values.openai.model .Values.openai.apiKey .Values.anthropic.model .Values.anthropic.apiKey .Values.lokiSelector (toString .Values.mock) | sha256sum }}
    spec:
      serviceAccountName: llm-assistant
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: llm-assistant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: llm-assistant, key: openai-api-key } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: llm-assistant, key: anthropic-api-key } }
            - name: LLM_PROVIDER
              value: {{ .Values.provider | quote }}
            - name: ANTHROPIC_MODEL
              value: {{ .Values.anthropic.model | quote }}
            - name: ANTHROPIC_BASE_URL
              value: {{ .Values.anthropic.baseUrl | quote }}
            - name: DIAGNOSE_TOKEN
              valueFrom: { secretKeyRef: { name: llm-assistant, key: diagnose-token } }
            - name: OPENAI_MODEL
              value: {{ .Values.openai.model | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.openai.baseUrl | quote }}
            - name: OPENAI_TIMEOUT
              value: {{ .Values.openai.timeout | quote }}
            - name: LLM_MOCK
              value: {{ .Values.mock | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheusUrl | quote }}
            - name: LOKI_URL
              value: {{ .Values.lokiUrl | quote }}
            - name: LOKI_SELECTOR
              value: {{ .Values.lokiSelector | quote }}
            - name: ALLOWED_NAMESPACES
              value: {{ .Values.targetNamespace | quote }}
            - name: ALLOWED_TARGETS
              value: {{ .Values.allowedTargets | quote }}
            - name: MAX_REPLICAS
              value: {{ .Values.maxReplicas | quote }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
{{ toYaml .Values.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-assistant
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: llm-assistant
spec:
  selector:
    app.kubernetes.io/name: llm-assistant
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: llm-assistant
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-assistant
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
