alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace, deployment]
      routes:
        - receiver: "null"
          matchers: ['alertname="Watchdog"']
        
        # 1. Сначала отправляем алерт в remediator для авто-исправления
        - receiver: remediator
          matchers: ['namespace="demo"']
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 5m
          continue: true # КРИТИЧНО: позволяет алерту пойти дальше по списку в tgbot

        # 2. Затем этот же алерт падает в tgbot, чтобы вы получили уведомление
        - receiver: tgbot
          matchers: ['namespace="demo"']
          group_wait: 5s
          group_interval: 1m
          repeat_interval: 5m