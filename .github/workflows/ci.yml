name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps-test:
    name: Тесты приложений (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test
        working-directory: apps

  remediator-test:
    name: Тесты ремедиатора и MTTR-скрипта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: remediator/requirements*.txt
      - run: pip install -r remediator/requirements.txt -r remediator/requirements-dev.txt
      - run: python -m pytest -q remediator/tests chaos/test_mttr.py

  llm-test:
    name: Тесты LLM-ассистента
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm/requirements*.txt
      - run: pip install -r llm/requirements-dev.txt
      - run: python -m pytest -q llm/tests

  helm-lint:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Линт локальных чартов
        run: |
          for chart in apps/chart remediator/chart llm/chart observability/alerts observability/dashboards; do
            echo "== $chart"
            helm lint "$chart"
          done

  gitleaks:
    name: Поиск секретов (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Скачать и запустить gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  images:
    name: Сборка и публикация образов (ghcr.io)
    # Образы собираются на каждом PR (проверка Dockerfile), публикуются только при пуше в develop/main
    needs: [apps-test, remediator-test, llm-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gateway
            context: apps
            file: apps/Dockerfile
            args: MODULE=gateway
          - name: orders
            context: apps
            file: apps/Dockerfile
            args: MODULE=orders
          - name: remediator
            context: remediator
            file: remediator/Dockerfile
            args: ""
          - name: llm-assistant
            context: llm
            file: llm/Dockerfile
            args: ""
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Войти в ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Метки образа
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sre-${{ matrix.name }}
          tags: |
            type=sha
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.args }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
