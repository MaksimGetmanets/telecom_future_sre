---
# Terraform из apt-репозитория HashiCorp. Пусто = последняя версия (в terraform/main.tf стоит ~> 1.5)
deploy_tools_terraform_version: ""
deploy_tools_packages:
  - make
  - git
  - unzip
  - gnupg
  - ca-certificates

# Версия kubectl = версия Kubernetes в k3s (v1.28.15+k3s1 -> v1.28.15)
deploy_tools_kubectl_version: "{{ (k3s_version | default('v1.28.15+k3s1')).split('+')[0] }}"
