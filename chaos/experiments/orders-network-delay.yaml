# Сценарий 2: сетевая деградация. Исходящий трафик orders задерживается на 1.5 с (+-200 мс).
# Ожидаем: растёт латентность, алерт по latency, remediator масштабирует orders.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: orders-network-delay
  namespace: demo
spec:
  action: delay
  mode: all
  selector:
    namespaces: [demo]
    labelSelectors:
      app.kubernetes.io/name: orders
  direction: to
  delay:
    latency: "1500ms"
    jitter: "200ms"
    correlation: "50"
  duration: "3m"
