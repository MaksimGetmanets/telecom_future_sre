spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  http:
    client:
      connect-timeout: 2s
      read-timeout: 3s

server:
  port: ${PORT:8080}
  shutdown: graceful

# В k8s значение задаёт Helm-чарт (http://orders:8080)
orders:
  url: ${ORDERS_URL:http://localhost:8081}

faults:
  enabled: ${FAULTS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      # Бакет 300ms нужен для SLO "p95 < 300 мс" (le="0.3")
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s

# JSON-логи; trace_id и span_id попадают из MDC, куда их кладёт OpenTelemetry agent
logging:
  structured:
    format:
      console: logstash
  level:
    root: INFO
